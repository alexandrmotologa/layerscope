name: LayerScope Container Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  layerscope-audit:
    name: OCI Security & Layer Efficiency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build LayerScope
        run: |
          go build -ldflags="-s -w" -o bin/layerscope ./cmd/layerscope

      - name: Run LayerScope Audit on Demo / Test Image
        id: audit
        run: |
          # Audit container layers for intermediate secrets, efficiency score and wasted space
          ./bin/layerscope audit demo --min-efficiency 60 --fail-on-secrets=false --format markdown --out layerscope-audit.md
          ./bin/layerscope sbom demo -f cyclonedx -o layerscope-sbom.json

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: layerscope-audit-reports
          path: |
            layerscope-audit.md
            layerscope-sbom.json

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('layerscope-audit.md', 'utf8');
            const commentBody = `### LayerScope Automated Image Audit\n\n${report}\n\n*Generated by [LayerScope](https://github.com/alexandrmotologa/layerscope)*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.body.includes('### LayerScope Automated Image Audit')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
